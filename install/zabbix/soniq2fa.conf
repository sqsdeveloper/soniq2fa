# /etc/zabbix/zabbix_agent2.d/soniq2fa.conf — items soniq2fa.ext[<public host name>], soniq2fa.login and soniq2fa.sms
UserParameter=soniq2fa.ext[*],/opt/zextras/lib/ext/soniq2fa/soniq2fa-check.sh ext "$1"
UserParameter=soniq2fa.login,/opt/zextras/lib/ext/soniq2fa/soniq2fa-check.sh login
UserParameter=soniq2fa.sms,/opt/zextras/lib/ext/soniq2fa/soniq2fa-check.sh sms
